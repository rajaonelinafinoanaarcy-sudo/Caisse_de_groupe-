<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A5F34">
<title>Caisse du groupe</title>
<style>
:root{
  --bg:#F1F5F0; --surface:#FFFFFF; --ink:#13201A; --muted:#5B6860; --line:#E0E8DF;
  --green:#0B6B3A; --on-green:#FFFFFF; --green-soft:#E0F2E7; --green-ink:#0A5430;
  --red:#BF3A2E; --red-soft:#FCE8E5; --amber:#7A4F00; --amber-soft:#FFF0CE;
  --band1:#09592F; --band2:#10824A;
  --shadow:0 1px 2px rgba(15,40,28,.06),0 10px 28px rgba(15,40,28,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D130F; --surface:#17201A; --ink:#E8F0EA; --muted:#94A298; --line:#26332B;
    --green:#4CC381; --on-green:#06210F; --green-soft:#163323; --green-ink:#86E3AE;
    --red:#F0786E; --red-soft:#3A1E1B; --amber:#EDBE63; --amber-soft:#3A2D10;
    --band1:#0A3B22; --band2:#0F5A35; --shadow:0 0 0 1px #26332B;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI Variable","Segoe UI",Roboto,system-ui,sans-serif;font-size:16px;line-height:1.45}
body.noscroll{overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted);font-size:14px}
.err{color:var(--red);font-size:14px;min-height:20px;margin:6px 0 2px}
.ok-msg{color:var(--green-ink);background:var(--green-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}

/* --- Bandeau --- */
.band{background:radial-gradient(120% 100% at 100% 0%,rgba(255,255,255,.16),transparent 55%),linear-gradient(160deg,var(--band1),var(--band2));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 26px;border-radius:0 0 30px 30px}
.band-in{max-width:640px;margin:0 auto}
.band .row1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.band .grp{font-size:15px;font-weight:700;letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.band .tools{display:flex;gap:8px}
.iconbtn{width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.band .lab{margin-top:20px;font-size:14px;opacity:.88}
.band .big{font-size:40px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0 16px}
.band .split{display:flex;gap:10px}
.band .pill{flex:1;background:rgba(255,255,255,.14);border-radius:16px;padding:10px 12px;font-size:13px}
.band .pill b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.band .title{margin-top:18px;font-size:27px;font-weight:800;letter-spacing:-.3px}
.band .sub{font-size:14px;opacity:.88;margin-top:2px}
.stripe{display:flex;height:5px;border-radius:99px;overflow:hidden;width:64px;margin-top:14px}
.stripe i{flex:1;background:#fff}.stripe i:nth-child(2){background:#FC3D32}.stripe i:nth-child(3){background:#2BB673}

main{max-width:640px;margin:0 auto;padding:18px 16px 112px}
.view{animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.view,.sheet{animation:none!important}}

/* --- Cartes et listes --- */
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
.sec h3{font-size:17px;font-weight:700}
ul.list{list-style:none;margin:0 0 14px;padding:0;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .body{flex:1;min-width:0}
.row .t{font-weight:650;word-break:break-word}
.row .s{font-size:13px;color:var(--muted);word-break:break-word}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.row .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--green)}.amt.out{color:var(--red)}
.av{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:800;font-size:15px;background:hsl(var(--h) 45% 88%);color:hsl(var(--h) 55% 24%)}
@media (prefers-color-scheme:dark){.av{background:hsl(var(--h) 28% 24%);color:hsl(var(--h) 65% 86%)}}
.mv{width:42px;height:42px;border-radius:14px;flex-shrink:0;display:grid;place-items:center}
.mv.in{background:var(--green-soft);color:var(--green-ink)}.mv.out{background:var(--red-soft);color:var(--red)}
.tag{display:inline-block;margin-top:4px;font-size:12px;color:var(--muted);background:var(--bg);border-radius:8px;padding:2px 8px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green-ink)}
.chip.wait{background:var(--amber-soft);color:var(--amber)}
.chip.no{background:var(--bg);color:var(--muted)}
.chip.bad{background:var(--red-soft);color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:26px 12px}
.bar{height:10px;background:var(--bg);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#2BB673);border-radius:99px}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--amber-soft);color:var(--amber);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-weight:600;font-size:15px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.quick .btn{flex-direction:column;gap:6px;min-height:84px;border-radius:18px;font-size:14px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sumgrid .card{margin:0}
.sumgrid .card b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.sumgrid .in b{color:var(--green)}.sumgrid .out b{color:var(--red)}

/* --- Formulaires et boutons --- */
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
input,select,textarea{display:block;width:100%;padding:0 14px;min-height:48px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid transparent;border-radius:14px}
textarea{padding:12px 14px;min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);background:var(--surface)}
.btn{border:0;border-radius:14px;padding:0 18px;min-height:48px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.iconbtn:focus-visible,nav.tabs button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.btn.primary{background:var(--green);color:var(--on-green)}
.btn.soft{background:var(--green-soft);color:var(--green-ink)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{min-height:36px;padding:0 13px;font-size:14px;border-radius:11px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.6}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;padding:8px}
.seg{display:flex;background:var(--surface);border-radius:16px;padding:4px;margin-bottom:14px;box-shadow:var(--shadow)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:11px 6px;border-radius:12px;font-weight:700;font-size:14px}
.seg button.on{background:var(--green);color:var(--on-green)}

/* --- Navigation basse --- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);box-shadow:0 -1px 0 var(--line),0 -8px 24px rgba(15,40,28,.06);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs .in{display:flex;max-width:640px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;padding:9px 0 9px;color:var(--muted);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
nav.tabs .pl{position:relative;width:54px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on .pl{background:var(--green-soft);color:var(--green-ink)}
.dot{position:absolute;top:-4px;right:2px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}

/* --- Fenêtres basses --- */
.overlay{position:fixed;inset:0;background:rgba(5,15,10,.5);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:20px;margin-bottom:6px}
.sheet .btns{display:flex;gap:10px;margin-top:14px}
.sheet .btns .btn{flex:1}
.bigcode{font-size:38px;font-weight:800;letter-spacing:8px;text-align:center;background:var(--green-soft);color:var(--green-ink);border-radius:18px;padding:16px 8px;margin:14px 0;font-variant-numeric:tabular-nums}
.big-amt{font-size:30px;font-weight:800;margin:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:40;max-width:90%;text-align:center}
.toast.bad{background:var(--red);color:#fff}

/* --- Écrans d'accueil (connexion) --- */
.auth{max-width:440px;margin:0 auto;padding:calc(36px + env(safe-area-inset-top)) 20px 40px}
.auth .logo{width:76px;height:76px;margin:0 auto 14px;display:block}
.auth h1{text-align:center;font-size:28px;font-weight:800;letter-spacing:-.4px}
.auth .tag2{text-align:center;color:var(--muted);margin:6px 0 24px}
.loading{min-height:100vh;display:grid;place-items:center}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spin"></div></div></div>
<div id="modal" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
/* =====================================================
   CONFIGURATION : adresse et clé publique du projet Supabase
   (renseignées une fois pour toutes dans cette application)
   ===================================================== */
const CONFIG = { url: 'https://nmloaycgzhyofppznomp.supabase.co', key: 'sb_publishable_6Esrnb5lf-tYRCD-BSZYrA_aNkbEZ8f' };

/* ---------- Utilitaires ---------- */
const $ = id => document.getElementById(id);
const val = id => ($(id) || {}).value || '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(n).toLocaleString('fr-FR') + ' Ar';
const fmtDate = d => new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
const monthLabel = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); };
const ymOf = iso => { const d = new Date(iso); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const now0 = new Date();
const ymNow = now0.getFullYear() + '-' + String(now0.getMonth() + 1).padStart(2, '0');
const parseAmt = s => { const n = Number(String(s).replace(/[\s\u00a0\u202f]/g, '').replace(',', '.')); return Number.isFinite(n) && n > 0 ? Math.round(n) : 0; };
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function toast(msg, bad) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, bad ? 4200 : 2600);
}
const ICON = {
  home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.6.2 4.5 2.2 4.5 5.3"/>',
  inflow: '<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/>',
  outflow: '<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 20h16"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  chart: '<path d="M5 20V11M12 20V4M19 20v-6"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  share: '<path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
};
const ic = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const initials = n => String(n).trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
const avatar = n => `<span class="av" style="--h:${hue(n)}">${esc(initials(n))}</span>`;

/* ---------- Connexion au serveur (Supabase) ---------- */
function cfg() { return (CONFIG.url && CONFIG.key) ? CONFIG : (LS.get('cfg') || {}); }
let session = LS.get('session');
function setSession(d) {
  if (!d) { session = null; LS.del('session'); return; }
  session = { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600), user: d.user || (session && session.user) };
  LS.set('session', session);
}
const TR = [
  [/invalid login credentials/i, 'Adresse mail ou mot de passe incorrect.'],
  [/user already registered|already been registered|user_already_exists/i, 'Un compte existe déjà avec cette adresse. Connectez-vous.'],
  [/at least 6 characters|weak_password|password should/i, 'Le mot de passe doit contenir au moins 6 caractères.'],
  [/email not confirmed/i, "Confirmez d'abord votre adresse mail."],
  [/rate limit|over_email/i, 'Trop de tentatives. Réessayez dans quelques minutes.'],
  [/unable to validate email|invalid format|invalid email/i, 'Adresse mail invalide.'],
  [/duplicate key|23505/i, 'Cet enregistrement existe déjà.'],
  [/jwt expired|invalid jwt/i, 'Session expirée. Reconnectez-vous.']
];
function tr(msg) { for (const [re, t] of TR) if (re.test(msg)) return t; return msg; }
async function raw(path, o = {}) {
  const c = cfg();
  if (!c.url) throw new Error('Application non configurée.');
  const headers = Object.assign({ apikey: c.key, 'Content-Type': 'application/json' }, o.headers || {});
  if (o.auth !== false && session) headers.Authorization = 'Bearer ' + session.access_token;
  let res;
  try { res = await fetch(c.url + path, { method: o.method || 'GET', headers, body: o.body !== undefined ? JSON.stringify(o.body) : undefined }); }
  catch (e) { throw new Error('Pas de connexion internet. Réessayez.'); }
  const txt = await res.text(); let data = null;
  if (txt) { try { data = JSON.parse(txt); } catch (e) { data = txt; } }
  if (!res.ok) {
    const m = (data && (data.message || data.msg || data.error_description || data.error)) || ('Erreur ' + res.status);
    const err = new Error(tr(String(m))); err.status = res.status; throw err;
  }
  return data;
}
async function ensureSession() {
  if (!session || session.expires_at - 60 > Date.now() / 1000) return;
  try { setSession(await raw('/auth/v1/token?grant_type=refresh_token', { method: 'POST', auth: false, body: { refresh_token: session.refresh_token } })); }
  catch (e) { if (e.status && e.status < 500) { setSession(null); A.screen = 'auth'; render(); } throw e; }
}
async function db(path, o = {}) { await ensureSession(); return raw('/rest/v1' + path, o); }
const rpc = (name, args) => db('/rpc/' + name, { method: 'POST', body: args || {} });
const insert = (table, row) => db('/' + table, { method: 'POST', body: row, headers: { Prefer: 'return=representation' } });
function myUid() {
  if (session && session.user && session.user.id) return session.user.id;
  try { return JSON.parse(atob(session.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub; } catch (e) { return null; }
}

/* ---------- État ---------- */
const A = { screen: 'boot', groups: [], gid: null, me: null, members: [], events: [], entries: [], sorties: [], invites: [] };
const ui = { tab: 'home', mode: 'mensuelle', month: ymNow, rep: 'all', evSel: '', authMode: 'login', gMode: 'join', busy: false, msg: '' };
const G = () => A.groups.find(g => g.id === A.gid) || {};
const COT = () => G().cotisation || 2000;
const isAdmin = () => !!A.me && A.me.role === 'admin';
const mName = id => { const m = A.members.find(m => m.id === id); return m ? m.nom : 'Membre retiré'; };
const evTitle = id => { const v = A.events.find(v => v.id === id); return v ? v.titre : ''; };
const entryWho = e => e.member_id ? mName(e.member_id) : (e.nom_libre || 'Anonyme');
const confirmed = () => A.entries.filter(e => e.statut === 'confirme');
const approved = () => A.sorties.filter(s => s.statut === 'approuve');
const total = a => a.reduce((t, x) => t + x.montant, 0);
const solde = () => total(confirmed()) - total(approved());
function monthStatus(id, ym) {
  const l = A.entries.filter(e => e.type === 'mensuelle' && e.member_id === id && e.mois === ym);
  if (l.some(e => e.statut === 'confirme')) return 'paye';
  if (l.some(e => e.statut === 'attente')) return 'attente';
  return 'non';
}
function movements() {
  const a = confirmed().map(e => ({
    date: e.decided_at || e.created_at, sens: 'in', montant: e.montant, qui: entryWho(e),
    titre: e.type === 'mensuelle' ? 'Cotisation de ' + monthLabel(e.mois) : "Cotisation d'occasion",
    cat: e.type === 'mensuelle' ? 'Cotisations mensuelles' : (evTitle(e.event_id) || 'Occasion')
  }));
  const b = approved().map(s => ({
    date: s.decided_at || s.created_at, sens: 'out', montant: s.montant, qui: s.demandeur,
    titre: s.motif, cat: evTitle(s.event_id) || 'Hors occasion'
  }));
  return a.concat(b).sort((x, y) => new Date(y.date) - new Date(x.date));
}

/* ---------- Chargement ---------- */
async function loadAll() {
  const groups = await db('/groups?select=*&order=created_at.asc');
  A.groups = groups;
  if (!groups.length) { A.gid = null; A.me = null; A.screen = 'nogroup'; return; }
  const saved = LS.get('gid');
  A.gid = groups.some(g => g.id === A.gid) ? A.gid : (groups.some(g => g.id === saved) ? saved : groups[0].id);
  const q = 'group_id=eq.' + A.gid;
  const [members, events, entries, sorties, invites] = await Promise.all([
    db(`/members?select=*&${q}&order=created_at.asc`),
    db(`/events?select=*&${q}&order=date.desc`),
    db(`/entries?select=*&${q}&order=created_at.desc`),
    db(`/sorties?select=*&${q}&order=created_at.desc`),
    db(`/invites?select=*&${q}`)
  ]);
  Object.assign(A, { members, events, entries, sorties, invites });
  A.me = members.find(m => m.user_id === myUid() && m.actif) || null;
  A.screen = A.me ? 'main' : 'nogroup';
}
async function refresh() { try { await loadAll(); } catch (e) { handleErr(e); } render(); }
function handleErr(e) {
  if (e.status === 401) { setSession(null); A.screen = 'auth'; render(); return; }
  toast(e.message || 'Une erreur est survenue', true);
}
async function run(fn, okMsg) {
  if (ui.busy) return; ui.busy = true;
  try { await fn(); if (okMsg) toast(okMsg); } catch (e) { handleErr(e); }
  finally { ui.busy = false; }
}

/* ---------- Fenêtres basses ---------- */

}
function closeSheet() { const m = $('modal'); m.hidden = true; m.innerHTML = ''; document.body.classList.remove('noscroll'); }
const sheetErr = m => { const e = $('sh-err'); if (e) e.textContent = m; };

/* ---------- Authentification ---------- */
function setCfg() {
  const url = val('c-url').trim().replace(/\/+$/, ''), key = val('c-key').trim();
  if (!/^https:\/\/.+/.test(url) || key.length < 20) return toast('Adresse ou clé invalide', true);
  LS.set('cfg', { url, key }); boot();
}
function setAuthMode(m) { ui.authMode = m; ui.msg = ''; render(); }
function doAuth() {
  run(async () => {
    const email = val('a-mail').trim().toLowerCase(), pw = val('a-pw');
    if (!/^\S+@\S+\.\S+$/.test(email)) throw new Error('Adresse mail invalide.');
    if (pw.length < 6) throw new Error('Le mot de passe doit contenir au moins 6 caractères.');
    if (ui.authMode === 'signup') {
      const d = await raw('/auth/v1/signup', { method: 'POST', auth: false, body: { email, password: pw } });
      if (d && d.access_token) setSession(d);
      else { ui.msg = 'Compte créé. Confirmez votre adresse mail, puis connectez-vous.'; ui.authMode = 'login'; render(); return; }
    } else {
      setSession(await raw('/auth/v1/token?grant_type=password', { method: 'POST', auth: false, body: { email, password: pw } }));
    }
    ui.msg = ''; await loadAll(); render();
  });
}
function logout() { closeSheet(); setSession(null); LS.del('gid'); Object.assign(A, { screen: 'auth', groups: [], gid: null, me: null }); ui.tab = 'home'; render(); }
function setGMode(m) { ui.gMode = m; render(); }
function doJoin() {
  run(async () => {
    const code = val('g-code').trim();
    if (!/^\d{6}$/.test(code)) throw new Error("Saisissez le code à 6 chiffres donné par l'administrateur.");
    const gid = await rpc('claim_invite', { p_code: code });
    if (!gid) throw new Error("Code incorrect, ou ce code n'est pas associé à votre adresse mail.");
    await loadAll(); render();
  }, 'Bienvenue dans le groupe');
}
function doCreateGroup() {
  run(async () => {
    const p = val('g-pin'), p2 = val('g-pin2');
    if (p !== p2) throw new Error('Les deux codes PIN ne sont pas identiques.');
    await rpc('create_group', { p_nom: val('g-nom'), p_admin_nom: val('g-moi'), p_pin: p });
    await loadAll(); render();
  }, 'Groupe créé');
}

/* ---------- Membres ---------- */
function addMember() {
  run(async () => {
    const nom = val('m-nom').trim(), email = val('m-mail').trim().toLowerCase();
    if (nom.length < 2) throw new Error('Saisissez le nom du membre.');
    if (!/^\S+@\S+\.\S+$/.test(email)) throw new Error('Adresse mail invalide.');
    const [m] = await insert('members', { group_id: A.gid, email, nom, tel: val('m-tel').trim() || null, role: 'membre' });
    await loadAll(); render();
    showInvite(m.id);
  });
}
function showInvite(id) {
  const m = A.members.find(x => x.id === id), inv = A.invites.find(i => i.member_id === id);
  if (!m) return;
  if (!inv) return toast(m.user_id ? 'Ce membre est déjà connecté' : 'Code indisponible, générez-en un nouveau', true);
  openSheet(`<h3>Invitation de ${esc(m.nom)}</h3>
    <p class="muted">Envoyez-lui ce code. Il devra créer son compte avec l'adresse <b>${esc(m.email)}</b>, puis saisir le code.</p>
    <div class="bigcode">${esc(inv.code)}</div>
    <div class="btns"><button class="btn line" onclick="newInvite('${m.id}')">Nouveau code</button><button class="btn primary" onclick="shareInvite('${m.id}')">${ic('share', 18)} Partager</button></div>`);
}
function shareInvite(id) {
  const m = A.members.find(x => x.id === id), inv = A.invites.find(i => i.member_id === id); if (!m || !inv) return;
  const text = `Bonjour ${m.nom}, rejoins le groupe « ${G().nom} » sur l'application Caisse du groupe.\n1) Ouvre l'application et crée un compte avec cette adresse : ${m.email}\n2) Saisis ce code d'invitation : ${inv.code}`;
  if (navigator.share) navigator.share({ text }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Message copié'), () => toast('Copie impossible', true));
}
function newInvite(id) {
  run(async () => { await rpc('reset_invite', { p_member: id }); await loadAll(); render(); showInvite(id); });
}
function removeMember(id) {
  openSheet(`<h3>Retirer ce membre ?</h3><p class="muted">${esc(mName(id))} n'aura plus accès au groupe. Son historique reste dans le rapport.</p>
    <div class="btns"><button class="btn line" onclick="closeSheet()">Annuler</button><button class="btn danger" onclick="doRemove('${id}')">Retirer</button></div>`);
}
function doRemove(id) {
  run(async () => { await db('/members?id=eq.' + id, { method: 'PATCH', body: { actif: false } }); closeSheet(); await loadAll(); render(); }, 'Membre retiré');
}

function askRole(id, role) {
  const n = esc(mName(id)), up = role === 'admin';

}

/* ---------- Entrées d'argent ---------- */
function setMode(m) { ui.mode = m; render(); }
function recordMonthly(memberId) {
  if (monthStatus(memberId, ui.month) !== 'non') return;
  run(async () => {
    await insert('entries', { group_id: A.gid, type: 'mensuelle', member_id: memberId, mois: ui.month, montant: COT(), statut: isAdmin() ? 'confirme' : 'attente' });

}
function addOccasion() {
  run(async () => {
    const eventId = val('o-ev'), montant = parseAmt(val('o-mt'));
    if (!eventId) throw new Error('Choisissez une occasion.');
    if (!montant) throw new Error('Saisissez un montant en ariary.');

function decideEntry(id, ok) {
  run(async () => { await rpc('decide_entry', { p_id: id, p_ok: ok }); await loadAll(); render(); }, ok ? 'Confirmé : ajouté aux fonds' : 'Entrée refusée');
}

/* ---------- Sorties d'argent ---------- */
function addSortie() {
  run(async () => {
    const montant = parseAmt(val('s-mt')), motif = val('s-motif').trim();
    if (!montant) throw new Error('Saisissez un montant en ariary.');
    if (motif.length < 3) throw new Error('Le motif est obligatoire.');
    let demandeur = A.me.nom;
    if (isAdmin()) { const w = val('s-who'); demandeur = w === '_autre' ? val('s-free').trim() : mName(w); if (!demandeur) throw new Error('Indiquez qui fait la demande.'); }
    await insert('sorties', { group_id: A.gid, montant, motif, demandeur, event_id: val('s-ev') || null, statut: 'attente', created_by: myUid() });
    await loadAll(); render();
  }, "Demande envoyée à l'administrateur");
}
function approveSortie(id) {
  const s = A.sorties.find(x => x.id === id); if (!s) return;
  if (s.montant > solde()) return toast('Fonds insuffisants. Solde : ' + fmt(solde()), true);
  openSheet(`<h3>Autoriser cette sortie</h3><div class="big-amt" style="color:var(--red)">${fmt(s.montant)}</div>
    <p class="muted">Motif : ${esc(s.motif)}<br>Demandé par ${esc(s.demandeur)}</p>
    <div class="field" style="margin-top:14px"><label>Code PIN du gestionnaire</label><input id="pin-in" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••"></div>
    <div id="sh-err" class="err"></div>
    <div class="btns"><button class="btn line" onclick="closeSheet()">Annuler</button><button class="btn primary" id="pin-ok">${ic('lock', 18)} Autoriser</button></div>`);
  const go = async () => {
    if (ui.busy) return; ui.busy = true;
    try { await rpc('decide_sortie', { p_id: id, p_ok: true, p_pin: val('pin-in') }); closeSheet(); await loadAll(); render(); toast('Sortie autorisée'); }
    catch (e) { sheetErr(e.message); const i = $('pin-in'); if (i) { i.value = ''; i.focus(); } }
    finally { ui.busy = false; }
  };
  $('pin-ok').onclick = go; $('pin-in').onkeydown = e => { if (e.key === 'Enter') go(); }; $('pin-in').focus();
}
function refuseSortie(id) {
  run(async () => { await rpc('decide_sortie', { p_id: id, p_ok: false, p_pin: '' }); await loadAll(); render(); }, 'Demande refusée');
}

/* ---------- Rapport ---------- */
function reportMovs() { return movements().filter(m => ui.rep === 'all' || ymOf(m.date) === ui.rep); }
function exportCsv() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['Date', 'Type', 'Montant (Ar)', 'Occasion / catégorie', 'Libellé / motif', 'Personne'].map(q).join(';')];
  reportMovs().forEach(m => rows.push([new Date(m.date).toLocaleDateString('fr-FR'), m.sens === 'in' ? 'Entrée' : 'Sortie', (m.sens === 'in' ? '' : '-') + m.montant, m.cat, m.titre, m.qui].map(q).join(';')));
  const csv = '\ufeff' + rows.join('\n');
  if (window.AndroidBridge) { window.AndroidBridge.saveFile('rapport-caisse.csv', csv); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'rapport-caisse.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

      const st = monthStatus(m.id, ui.month);
      return `<li class="row">${avatar(m.nom)}<div class="body"><div class="t">${esc(m.nom)}</div><div class="s">${fmt(cot)}</div></div>
      <div class="end">${chip(st)}${st === 'non' ? `<button class="btn sm primary" onclick="recordMonthly('${m.id}')">${admin ? 'Encaisser' : 'Déclarer mon paiement'}</button>` : ''}</div></li>`;
    }).join('')}</ul>`;
  } else if (!A.events.length) {
    body = emptyBox(admin ? `Créez d'abord une occasion pour y rattacher les cotisations.<br><br><button class="btn primary" onclick="go('evenements')">Ajouter un évènement</button>` : "Aucune occasion n'a été créée pour l'instant.");
  } else {
    body = `<div class="card"><div class="field"><label>Occasion</label><select id="o-ev">${eventOptions(ui.evSel)}</select></div>
    ${admin ? `<div class="field"><label>Qui cotise</label><select id="o-who" onchange="$('o-free').parentNode.hidden=this.value!=='_autre'">${memberOptions()}</select></div>
    <div class="field" hidden><label>Nom de la personne</label><input id="o-free"></div>` : ''}
    <div class="field"><label>Montant (Ar)</label><input id="o-mt" inputmode="numeric" placeholder="Ex. 5000"></div>
    <button class="btn primary wide" onclick="addOccasion()">${admin ? 'Encaisser' : 'Déclarer ma cotisation'}</button></div>`;
  }
  const pend = A.entries.filter(e => e.statut === 'attente');
  return `${seg}${body}${sec('En attente de confirmation')}
  ${pend.length ? `<ul class="list">${pend.map(e => `<li class="row">${avatar(entryWho(e))}<div class="body"><div class="t">${esc(entryWho(e))}</div>
    <div class="s">${e.type === 'mensuelle' ? 'Cotisation de ' + monthLabel(e.mois) : esc(evTitle(e.event_id) || 'Occasion')}</div>
    ${admin ? `<div class="acts"><button class="btn sm primary" onclick="decideEntry('${e.id}',true)">Confirmer</button><button class="btn sm line" onclick="decideEntry('${e.id}',false)">Refuser</button></div>` : ''}</div>
    <div class="end"><span class="amt in">${fmt(e.montant)}</span>${admin ? '' : chip('attente')}</div></li>`).join('')}</ul>` : emptyBox('Rien à confirmer.')}`;
}

function viewSorties() {
  const admin = isAdmin();
  const pend = A.sorties.filter(s => s.statut === 'attente');
  const hist = A.sorties.filter(s => s.statut !== 'attente').slice(0, 20);
  return `<p class="muted" style="margin:0 4px 12px">Chaque sortie doit être autorisée par l'administrateur avec son code PIN.</p>
  <div class="card"><div class="field"><label>Montant demandé (Ar)</label><input id="s-mt" inputmode="numeric" placeholder="Ex. 10000"></div>
  <div class="field"><label>Motif de la demande</label><textarea id="s-motif" placeholder="À quoi servira cet argent ?"></textarea></div>
  ${admin ? `<div class="field"><label>Demandeur</label><select id="s-who" onchange="$('s-free').parentNode.hidden=this.value!=='_autre'">${memberOptions()}</select></div>
  <div class="field" hidden><label>Nom du demandeur</label><input id="s-free"></div>` : ''}
  <div class="field"><label>Occasion concernée</label><select id="s-ev">${eventOptions('', 'Aucune occasion')}</select></div>
  <button class="btn primary wide" onclick="addSortie()">Envoyer la demande</button></div>
  ${sec('Demandes en attente')}
  ${pend.length ? `<ul class="list">${pend.map(s => `<li class="row"><span class="mv out">${ic('outflow', 20)}</span><div class="body"><div class="t">${esc(s.motif)}</div>
    <div class="s">${esc(s.demandeur)}, ${fmtDate(s.created_at)}${s.event_id ? ', ' + esc(evTitle(s.event_id)) : ''}</div>
    ${admin && s.montant > solde() ? '<div class="s" style="color:var(--red)">Dépasse le solde actuel</div>' : ''}
    ${admin ? `<div class="acts"><button class="btn sm primary" onclick="approveSortie('${s.id}')">Autoriser avec le PIN</button><button class="btn sm line" onclick="refuseSortie('${s.id}')">Refuser</button></div>` : ''}</div>
    <div class="end"><span class="amt out">${fmt(s.montant)}</span>${admin ? '' : chip('attente')}</div></li>`).join('')}</ul>` : emptyBox('Aucune demande en attente.')}
  ${hist.length ? `${sec('Historique')}<ul class="list">${hist.map(s => `<li class="row"><span class="mv out">${ic('outflow', 20)}</span><div class="body"><div class="t">${esc(s.motif)}</div><div class="s">${esc(s.demandeur)}, ${fmtDate(s.decided_at || s.created_at)}</div></div><div class="end">${chip(s.statut)}<span class="amt">${fmt(s.montant)}</span></div></li>`).join('')}</ul>` : ''}`;
}

function viewEvents() {
  const admin = isAdmin();
  return `${admin ? `<div class="card"><div class="field"><label>Nom de l'évènement</label><input id="v-titre" placeholder="Ex. Mariage de Rivo"></div>
  <div class="field"><label>Date</label><input id="v-date" type="date" value="${new Date().toISOString().slice(0, 10)}"></div>
  <div class="field"><label>Note (facultatif)</label><input id="v-note"></div>
  <button class="btn primary wide" onclick="addEvent()">${ic('plus', 18)} Ajouter l'évènement</button></div>` : ''}
  ${sec('Évènements')}
  ${A.events.length ? `<ul class="list">${A.events.map(v => {
    const inn = total(confirmed().filter(e => e.event_id === v.id)), out = total(approved().filter(s => s.event_id === v.id));
    const used = A.entries.some(e => e.event_id === v.id) || A.sorties.some(s => s.event_id === v.id);
    return `<li class="row"><span class="mv in">${ic('calendar', 20)}</span><div class="body"><div class="t">${esc(v.titre)}</div><div class="s">${fmtDate(v.date)}${v.note ? ', ' + esc(v.note) : ''}</div>
    <div class="s">Collecté : ${fmt(inn)}<br>Dépensé : ${fmt(out)}</div>
    <div class="acts"><button class="btn sm primary" onclick="goCotiser('${v.id}')">Cotiser</button>${admin && !used ? `<button class="btn sm line" onclick="deleteEvent('${v.id}')">Supprimer</button>` : ''}</div></div></li>`;
  }).join('')}</ul>` : emptyBox(admin ? 'Aucun évènement. Ajoutez-en un pour ouvrir une cotisation d\'occasion.' : 'Aucun évènement pour l\'instant.')}`;
}

function viewRapport() {
  const all = movements();
  const months = [...new Set(all.map(m => ymOf(m.date)).concat([ymNow]))].sort().reverse();
  const mv = reportMovs(), ins = mv.filter(m => m.sens === 'in'), outs = mv.filter(m => m.sens === 'out');
  const group = a => { const o = {}; a.forEach(m => o[m.cat] = (o[m.cat] || 0) + m.montant); return Object.entries(o).sort((x, y) => y[1] - x[1]); };
  const lines = (g, cls) => g.length ? `<ul class="list">${g.map(([k, v]) => `<li class="row"><div class="body t">${esc(k)}</div><div class="amt ${cls}">${fmt(v)}</div></li>`).join('')}</ul>` : emptyBox('Rien sur cette période.');
  const ti = total(ins), to = total(outs);
  return `<div class="card"><div class="field" style="margin:0"><label>Période</label><select onchange="ui.rep=this.value;render()"><option value="all" ${ui.rep === 'all' ? 'selected' : ''}>Depuis le début</option>${months.map(m => `<option value="${m}" ${ui.rep === m ? 'selected' : ''}>${monthLabel(m)}</option>`).join('')}</select></div></div>
  <div class="sumgrid"><div class="card in"><span class="muted">Entrées</span><b>${fmt(ti)}</b></div><div class="card out"><span class="muted">Sorties</span><b>${fmt(to)}</b></div></div>
  <div class="card">Différence sur la période : <b>${fmt(ti - to)}</b><div class="muted">Fonds disponibles aujourd'hui : ${fmt(solde())}</div></div>
  ${sec('Entrées par catégorie ou occasion')}${lines(group(ins), 'in')}
  ${sec('Sorties par occasion')}${lines(group(outs), 'out')}
  ${sec('Journal détaillé')}
  ${mv.length ? `<ul class="list">${mv.map(moveRow).join('')}</ul>` : emptyBox('Aucun mouvement confirmé sur cette période.')}
  <p class="muted" style="margin:0 4px 14px">Seuls les paiements confirmés et les sorties autorisées sont comptés.</p>
  <button class="btn line wide" onclick="exportCsv()">Exporter en CSV</button>`;
}

/* ---------- Affichage ---------- */
const TABS = [['home', 'Accueil', 'home'], ['membres', 'Membres', 'users'], ['entrees', 'Entrées', 'inflow'], ['sorties', 'Sorties', 'outflow'], ['evenements', 'Évènements', 'calendar'], ['rapport', 'Rapport', 'chart']];
const VIEWS = { home: viewHome, membres: viewMembres, entrees: viewEntrees, sorties: viewSorties, evenements: viewEvents, rapport: viewRapport };
const TITLES = { membres: ['Membres', 'Le groupe et ses cotisations'], entrees: ['Entrées d\'argent', 'Cotisations mensuelles et d\'occasion'], sorties: ['Sorties d\'argent', 'Demandes et autorisations'], evenements: ['Évènements', 'Les occasions du groupe'], rapport: ['Rapport', 'Entrées, sorties et motifs'] };
function go(t) { ui.tab = t; render(); window.scrollTo(0, 0); }
function badge(t) {
  if (!isAdmin()) return 0;
  return t === 'entrees' ? A.entries.filter(e => e.statut === 'attente').length : t === 'sorties' ? A.sorties.filter(s => s.statut === 'attente').length : 0;
}
function render() {
  const app = $('app');
  if (A.screen === 'boot') { app.innerHTML = '<div class="loading"><div class="spin"></div></div>'; return; }
  if (A.screen === 'config') { app.innerHTML = configScreen(); return; }
  if (A.screen === 'auth') { app.innerHTML = authScreen(); return; }
  if (A.screen === 'nogroup') { app.innerHTML = noGroupScreen(); return; }
  const home = ui.tab === 'home';
  const band = `<header class="band"><div class="band-in"><div class="row1"><div class="grp">${esc(G().nom)}</div>
    <div class="tools"><button class="iconbtn" onclick="refresh()" aria-label="Actualiser">${ic('refresh', 20)}</button><button class="iconbtn" onclick="openProfile()" aria-label="Mon profil">${ic('user', 20)}</button></div></div>
    ${home ? `<div class="lab">Fonds disponibles</div><div class="big">${fmt(solde())}</div>
      <div class="split"><div class="pill">Entrées<b>${fmt(total(confirmed()))}</b></div><div class="pill">Sorties<b>${fmt(total(approved()))}</b></div></div>`
    : `<div class="title">${TITLES[ui.tab][0]}</div><div class="sub">${TITLES[ui.tab][1]}</div>`}
    <div class="stripe"><i></i><i></i><i></i></div></div></header>`;
  app.innerHTML = band + `<main class="view" id="view">${VIEWS[ui.tab]()}</main>
    <nav class="tabs"><div class="in">${TABS.map(t => `<button class="${ui.tab === t[0] ? 'on' : ''}" onclick="go('${t[0]}')"><span class="pl">${ic(t[2], 22)}${badge(t[0]) ? `<span class="dot">${badge(t[0])}</span>` : ''}</span>${t[1]}</button>`).join('')}</div></nav>`;
}

/* ---------- Démarrage ---------- */
async function boot() {
  if (!cfg().url) { A.screen = 'config'; render(); return; }
  if (!session) { A.screen = 'auth'; render(); return; }
  A.screen = 'boot'; render();
  try { await loadAll(); } catch (e) { if (e.status === 401 || !session) { setSession(null); A.screen = 'auth'; } else { A.screen = 'auth'; ui.msg = e.message; } }
  render();
}
// Mise à jour automatique discrète (sans casser une saisie en cours)
setInterval(async () => {
  if (A.screen !== 'main' || document.hidden || ui.busy || !$('modal').hidden) return;
  const el = document.activeElement;
  if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
  try { await loadAll(); render(); } catch (e) {}
}, 45000);
boot();
</script>
</body>
</html>
